<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Код авторизации VK ID</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .auth{max-width:640px;margin:0 auto;padding:40px 0}
  .auth h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;
    letter-spacing:-.02em;margin:0 0 10px}
  .auth p{font-size:15px;line-height:1.5;color:var(--ink2);margin:0 0 20px}
  .field{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:12px}
  .field .lbl{font-size:12px;color:var(--ink3);margin-bottom:5px}
  .field .val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:14px;word-break:break-all;line-height:1.45}
  .cmd{background:var(--ink);color:#EAF2EE;border-radius:14px;padding:15px 16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
    line-height:1.5;word-break:break-all;margin-bottom:12px}
  button{background:var(--green);color:#fff;border:0;border-radius:12px;
    padding:13px 18px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--green-dark)}
  .miss{background:var(--orange-soft);border:1px solid rgba(232,115,12,.32);
    border-radius:14px;padding:16px;font-size:14.5px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap auth">
  <h1>Код авторизации VK ID</h1>
  <p>Страница нужна только для разовой настройки: ВКонтакте возвращает сюда код,
     по которому бот получает право прикладывать карточки к записям. Ничего не
     сохраняется и никуда не отправляется — код виден только в этом окне.</p>
  <div id="out"></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), device = q.get('device_id'), err = q.get('error');
  var out = document.getElementById('out');

  if (err) {
    out.innerHTML = '<div class="miss"><b>ВКонтакте вернул ошибку:</b><br>' +
      String(err).replace(/[<>&]/g, '') + '<br><br>Запустите вход заново.</div>';
    return;
  }
  if (!code || !device) {
    out.innerHTML = '<div class="miss">Кода в адресе нет. Откройте ссылку, ' +
      'которую напечатал <code>tool/vk_auth.dart</code>, и подтвердите доступ ' +
      'во ВКонтакте — сюда вернётесь автоматически.</div>';
    return;
  }

  var cmd = 'dart run tool/vk_auth.dart --code ' + code + ' --device-id ' + device;
  var box = document.createElement('div');
  box.innerHTML =
    '<div class="field"><div class="lbl">code</div><div class="val">' + code + '</div></div>' +
    '<div class="field"><div class="lbl">device_id</div><div class="val">' + device + '</div></div>' +
    '<p>Выполните на сервере, в папке <code>vyplaty_bot</code>:</p>' +
    '<div class="cmd" id="cmd">' + cmd + '</div>';
  out.appendChild(box);

  var btn = document.createElement('button');
  btn.textContent = 'Скопировать команду';
  btn.onclick = function () {
    navigator.clipboard.writeText(cmd).then(function () {
      btn.textContent = 'Скопировано';
      setTimeout(function () { btn.textContent = 'Скопировать команду'; }, 2000);
    });
  };
  out.appendChild(btn);
})();
</script>
</body>
</html>
